[package]
name = "jusso"
version = "0.1.0-beta.1"
edition = "2021"
description = "Jusso: on-chain execution infrastructure for autonomous AI agents"
license = "AGPL-3.0-only"
default-run = "jusso-server"

[[bin]]
name = "jusso-server"
path = "src/main.rs"

[[bin]]
name = "jusso"
path = "src/bin/jusso.rs"

[[bin]]
name = "jusso-arc-probe"
path = "src/bin/arc_probe.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "8.3"
serde_urlencoded = "0.7"
schemars = "1"

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Blockchain — ethers
ethers = { version = "2", features = ["legacy", "rustls"] }

# Logging / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP clients for wallet APIs, auth, and protocol reads
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dotenvy = "0.15"
hex = "0.4"
async-trait = "0.1"

# Authentication-secret encryption and signing
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
turnkey_client = "0.13.1"

# Remote MCP and owner approval ceremonies
rmcp = { version = "3.5.0", features = ["server", "transport-streamable-http-server"] }
webauthn-rs = { version = "0.5.2", features = ["danger-allow-state-serialisation"] }
