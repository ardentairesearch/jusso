          default: ethereum
        pool:
          type: string
        amounts_in:
          type: array
          minItems: 1
          maxItems: 3
          items:
            "$ref": "#/components/schemas/BalancerTokenAmount"
        min_bpt_amount_out_raw:
          type:
          - string
          - 'null'
