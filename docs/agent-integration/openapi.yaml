      - health_factor
    AaveAssetBalance:
      type: object
      properties:
        symbol:
          type: string
        underlying_address:
          type: string
        decimals:
          type: integer
        wallet_balance_raw:
          type: string
        wallet_balance_formatted:
          type: string
        a_token_address:
          type: string
        a_token_balance_raw:
          type: string
        a_token_balance_formatted:
          type: string
        stable_debt_token_address:
          type: string
        stable_debt_balance_raw:
          type: string
        stable_debt_balance_formatted:
          type: string
        variable_debt_token_address:
          type: string
        variable_debt_balance_raw:
          type: string
        variable_debt_balance_formatted:
          type: string
      required:
