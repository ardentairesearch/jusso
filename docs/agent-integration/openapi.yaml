        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterDelegationRequest"
      responses:
        '201':
          description: Delegation registered and owner transaction prepared
        '400':
          "$ref": "#/components/responses/ErrorResponse"
        '401':
          "$ref": "#/components/responses/ErrorResponse"
  "/delegations/{agent_id}":
