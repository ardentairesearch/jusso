        '404':
          "$ref": "#/components/responses/ErrorResponse"
  "/oauth/token":
    post:
      summary: Exchange a private-key JWT assertion for a short-lived access token
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              - client_id
              - client_assertion_type
              - client_assertion
              properties:
                grant_type:
                  type: string
                  const: client_credentials
                client_id:
                  type: string
                client_assertion_type:
                  type: string
                  const: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                client_assertion:
                  type: string
                scope:
                  type: string
      responses:
        '200':
          description: Short-lived OAuth access token
        '401':
          "$ref": "#/components/responses/ErrorResponse"
