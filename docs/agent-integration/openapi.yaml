      - underlying_address
      - decimals
      - wallet_balance_raw
      - wallet_balance_formatted
      - a_token_address
      - a_token_balance_raw
      - a_token_balance_formatted
      - stable_debt_token_address
      - stable_debt_balance_raw
      - stable_debt_balance_formatted
      - variable_debt_token_address
      - variable_debt_balance_raw
      - variable_debt_balance_formatted
    AaveBalancesResponse:
      type: object
