          type: string
        chain:
          type: string
        smart_wallet_address:
          type: string
        pool_address:
          type: string
        assets:
          type: array
          items:
            "$ref": "#/components/schemas/AaveAssetBalance"
      required:
      - agent_id
      - chain
      - smart_wallet_address
      - pool_address
      - assets
    BalancerSwapRequest:
      type: object
      properties:
        agent_id:
          type: string
        chain:
          type: string
          enum:
          - ethereum
          default: ethereum
        pool:
          type:
          - string
          - 'null'
          description: Registered Balancer V3 Ethereum Sepolia pool address. Omit
            for automatic discovery and best-quote selection.
        token_in:
          type: string
        token_out:
          type: string
        swap_kind:
          type: string
          enum:
          - exact_in
          - exact_out
          default: exact_in
        amount_raw:
          type: string
          description: Exact input amount for exact_in, or exact output amount for
            exact_out.
        limit_raw:
          type:
          - string
          - 'null'
          description: Minimum output for exact_in, or maximum input for exact_out.
            Derived from the quote when omitted.
        slippage_bps:
          type: integer
          minimum: 0
          maximum: 10000
          default: 100
        deadline:
          type:
          - integer
          - 'null'
          description: Future Unix timestamp. Defaults to twenty minutes after request
            handling.
        strategy_id:
          type:
          - string
          - 'null'
        callback_url:
          type:
          - string
          - 'null'
          format: uri
      required:
      - agent_id
      - token_in
      - token_out
      - amount_raw
    BalancerQuoteResponse:
      type: object
      properties:
        agent_id:
          type: string
        chain:
          type: string
        smart_wallet_address:
          type: string
        pool_address:
          type: string
        pool_selection:
          type: string
          enum:
          - automatic
          - explicit
        candidates_discovered:
          type: integer
        candidates_quoted:
          type: integer
        token_in:
          type: string
        token_out:
          type: string
        swap_kind:
          type: string
        amount_raw:
          type: string
        quoted_amount_raw:
          type: string
        limit_raw:
          type: string
        slippage_bps:
          type: integer
        deadline:
          type: integer
    BalancerPoolsResponse:
      type: object
      properties:
        chain:
          type: string
        token_in:
          type: string
        token_out:
          type: string
        pools:
          type: array
          items:
            type: object
            properties:
              pool_address:
                type: string
              name:
                type: string
              symbol:
                type: string
              pool_type:
                type: string
              total_liquidity_usd:
                type:
                - string
                - 'null'
              swap_fee:
                type:
                - string
                - 'null'
              is_initialized:
                type: boolean
              is_paused:
                type: boolean
              is_in_recovery_mode:
                type: boolean
              tokens:
                type: array
                items:
                  type: object
                  properties:
                    address:
                      type: string
                    symbol:
                      type: string
                    decimals:
                      type: integer
                    index:
