---
schemas:
  AaveSupplyRequest:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
        enum:
        - ethereum
        default: ethereum
        description: Hosted testnet uses ethereum as the Sepolia chain label.
      asset:
        type: string
        enum:
        - AAVE
        - DAI
        - EURS
        - GHO
        - LINK
        - USDC
        - USDT
        - WBTC
        - WETH
      amount:
        type:
        - string
        - number
        - 'null'
        description: Human-readable token amount. JSON numbers are accepted; strings are recommended for precision-sensitive decimals.
      amount_raw:
        type:
        - string
        - 'null'
        description: Raw token base-unit amount. Provide either amount or amount_raw.
      referral_code:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 65535
      strategy_id:
        type:
        - string
        - 'null'
      callback_url:
        type:
        - string
        - 'null'
        format: uri
    required:
    - agent_id
    - asset
  AaveWithdrawRequest:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
        enum:
        - ethereum
        default: ethereum
      asset:
        type: string
        enum:
        - AAVE
        - DAI
        - EURS
        - GHO
        - LINK
        - USDC
        - USDT
        - WBTC
        - WETH
      amount:
        type:
        - string
        - number
        - 'null'
        description: Human-readable token amount, or "max". JSON numbers are also accepted.
      amount_raw:
        type:
        - string
        - 'null'
        description: Raw token base-unit amount, or "max".
      to:
        type:
        - string
        - 'null'
        description: Optional recipient address. Defaults to the agent wallet.
      strategy_id:
        type:
        - string
        - 'null'
      callback_url:
        type:
        - string
        - 'null'
        format: uri
    required:
    - agent_id
    - asset
  AaveRepayRequest:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
        enum:
        - ethereum
        default: ethereum
      asset:
        type: string
        enum:
        - AAVE
        - DAI
        - EURS
        - GHO
        - LINK
        - USDC
        - USDT
        - WBTC
        - WETH
      amount:
        type:
        - string
        - number
        - 'null'
        description: Human-readable token amount, or "max". JSON numbers are also accepted.
      amount_raw:
        type:
        - string
        - 'null'
        description: Raw token base-unit amount, or "max".
      interest_rate_mode:
        type:
        - integer
        - 'null'
        enum:
        - 1
        - 2
        default: 2
        description: 1 = stable, 2 = variable.
      on_behalf_of:
        type:
        - string
        - 'null'
        description: Optional debt owner. Defaults to the agent wallet.
      strategy_id:
        type:
        - string
        - 'null'
      callback_url:
        type:
        - string
        - 'null'
        format: uri
    required:
    - agent_id
    - asset
  AaveBorrowRequest:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
        enum:
        - ethereum
        default: ethereum
      asset:
        type: string
        enum:
        - AAVE
        - DAI
        - EURS
        - GHO
        - LINK
        - USDC
        - USDT
        - WBTC
        - WETH
      amount:
        type:
        - string
        - number
        - 'null'
        description: Human-readable token amount, or "max". JSON numbers are also accepted.
      amount_raw:
        type:
        - string
        - 'null'
        description: Raw token base-unit amount, or "max".
      interest_rate_mode:
        type:
        - integer
        - 'null'
        enum:
        - 1
        - 2
        default: 2
        description: 1 = stable, 2 = variable.
      referral_code:
        type:
        - integer
        - 'null'
        minimum: 0
        maximum: 65535
      on_behalf_of:
        type:
        - string
        - 'null'
        description: Optional debt owner. Defaults to the agent wallet.
      min_health_factor:
        type:
        - string
        - number
        - 'null'
        default: '1.05'
        description: Minimum projected health factor after borrow. Must be at least
          1.0.
      strategy_id:
        type:
        - string
        - 'null'
      callback_url:
        type:
        - string
        - 'null'
        format: uri
    required:
    - agent_id
    - asset
  AavePositionResponse:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
      smart_wallet_address:
        type: string
      pool_address:
        type: string
      total_collateral_base:
        type: string
      total_debt_base:
        type: string
      available_borrows_base:
        type: string
      current_liquidation_threshold_bps:
        type: string
      ltv_bps:
        type: string
      health_factor:
        type: string
    required:
    - agent_id
    - chain
    - smart_wallet_address
    - pool_address
    - total_collateral_base
    - total_debt_base
    - available_borrows_base
    - current_liquidation_threshold_bps
    - ltv_bps
    - health_factor
  AaveAssetBalance:
    type: object
    properties:
      symbol:
        type: string
      underlying_address:
        type: string
      decimals:
        type: integer
      wallet_balance_raw:
        type: string
      wallet_balance_formatted:
        type: string
      a_token_address:
        type: string
      a_token_balance_raw:
        type: string
      a_token_balance_formatted:
        type: string
      stable_debt_token_address:
        type: string
      stable_debt_balance_raw:
        type: string
      stable_debt_balance_formatted:
        type: string
      variable_debt_token_address:
        type: string
      variable_debt_balance_raw:
        type: string
      variable_debt_balance_formatted:
        type: string
    required:
    - symbol
    - underlying_address
    - decimals
    - wallet_balance_raw
    - wallet_balance_formatted
    - a_token_address
    - a_token_balance_raw
    - a_token_balance_formatted
    - stable_debt_token_address
    - stable_debt_balance_raw
    - stable_debt_balance_formatted
    - variable_debt_token_address
    - variable_debt_balance_raw
    - variable_debt_balance_formatted
  AaveBalancesResponse:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
      smart_wallet_address:
        type: string
      pool_address:
        type: string
      assets:
        type: array
        items:
          "$ref": "#/components/schemas/AaveAssetBalance"
    required:
    - agent_id
    - chain
    - smart_wallet_address
    - pool_address
    - assets
