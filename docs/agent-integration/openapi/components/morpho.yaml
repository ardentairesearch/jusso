---
schemas:
    MorphoActionRequest:
      type: object
      required:
      - agent_id
      properties:
        agent_id:
          type: string
        chain:
          type: string
          enum: [base]
          default: base
        market_id:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
          default: "0x6143c1e52ed45fb9a0551b349abb4a1b8c5962dd39545ac235a9c98610bf97da"
          description: Morpho Blue market ID. The default is Ardent's preconfigured Base Sepolia USDC/WETH 86% LLTV test market.
        amount:
          type: [string, number]
          description: Human-readable amount. JSON numbers are accepted; strings are recommended for precision-sensitive decimals. Some actions also support max.
        amount_raw:
          type: string
          description: Integer amount in native token units. Some actions also support max.
        min_health_factor:
          type: [string, number, "null"]
          description: Minimum projected health factor for borrow and collateral withdrawal. Defaults to 1.05 and must be at least 1.0.
        strategy_id:
          type: string
        callback_url:
          type: string
          format: uri
      oneOf:
      - required: [amount]
      - required: [amount_raw]
    MorphoToken:
      type: object
      required: [address, symbol, decimals]
      properties:
        address: { type: string }
        symbol: { type: string }
        decimals: { type: integer }
    MorphoMarketResponse:
      type: object
      required:
      - chain
      - morpho_address
      - market_id
      - loan_token
      - collateral_token
      - lltv_percent
      - oracle_status
      - total_supply_assets_raw
      - total_borrow_assets_raw
      - liquidity_assets_raw
      properties:
        chain: { type: string }
        morpho_address: { type: string }
        market_id: { type: string }
        loan_token: { "$ref": "#/components/schemas/MorphoToken" }
        collateral_token: { "$ref": "#/components/schemas/MorphoToken" }
        oracle_address: { type: string }
        irm_address: { type: string }
        lltv_raw: { type: string }
        lltv_percent: { type: string }
        oracle_price_raw:
          type: [string, "null"]
          description: Null when the market oracle is stale, unavailable, or not configured.
        oracle_status:
          type: string
          enum: [available, stale, unavailable, zero_price, not_configured]
        total_supply_assets_raw: { type: string }
        total_supply_assets_formatted: { type: string }
        total_borrow_assets_raw: { type: string }
        total_borrow_assets_formatted: { type: string }
        liquidity_assets_raw: { type: string }
        liquidity_assets_formatted: { type: string }
        utilization_percent: { type: string }
        accrual_borrow_rate_per_second_raw:
          type: string
          description: Average per-second rate used if pending market interest were accrued at the read block.
        accrual_borrow_apr_percent:
          type: string
          description: Simple annualization of the pending-accrual average borrow rate.
        fee_raw: { type: string }
        fee_percent: { type: string }
        last_update: { type: string }
    MorphoMarketsResponse:
      type: object
      properties:
        chain: { type: string }
        loan_token_filter: { type: [string, "null"] }
        collateral_token_filter: { type: [string, "null"] }
        require_available_oracle: { type: boolean }
        recommended_market_id:
          type: [string, "null"]
          description: Highest-ranked market after all caller-supplied filters.
        ranking: { type: string }
        markets:
          type: array
          items: { "$ref": "#/components/schemas/MorphoMarketResponse" }
    MorphoPositionResponse:
      type: object
      required:
      - agent_id
      - chain
      - smart_wallet_address
      - market_id
      - loan_token
      - collateral_token
      - supplied_assets_raw
      - borrowed_assets_raw
      - collateral_assets_raw
      - is_healthy
      - oracle_status
      properties:
        agent_id: { type: string }
        chain: { type: string }
        smart_wallet_address: { type: string }
        morpho_address: { type: string }
        market_id: { type: string }
        loan_token: { "$ref": "#/components/schemas/MorphoToken" }
        collateral_token: { "$ref": "#/components/schemas/MorphoToken" }
        wallet_loan_balance_raw: { type: string }
        wallet_loan_balance_formatted: { type: string }
        wallet_collateral_balance_raw: { type: string }
        wallet_collateral_balance_formatted: { type: string }
        supply_shares_raw: { type: string }
        supplied_assets_raw: { type: string }
        supplied_assets_formatted: { type: string }
        borrow_shares_raw: { type: string }
        borrowed_assets_raw: { type: string }
        borrowed_assets_formatted: { type: string }
        collateral_assets_raw: { type: string }
        collateral_assets_formatted: { type: string }
        collateral_value_in_loan_assets_raw:
          type: [string, "null"]
        collateral_value_in_loan_assets_formatted:
          type: [string, "null"]
        borrow_capacity_raw:
          type: [string, "null"]
        borrow_capacity_formatted:
          type: [string, "null"]
        available_borrow_raw:
          type: [string, "null"]
        available_borrow_formatted:
          type: [string, "null"]
        health_factor:
          type: [string, "null"]
        ltv_percent:
          type: [string, "null"]
        lltv_percent: { type: string }
        is_healthy:
          type: [boolean, "null"]
          description: Null when debt exists but the oracle is unavailable.
        oracle_status:
          type: string
          enum: [available, stale, unavailable, zero_price, not_configured]
