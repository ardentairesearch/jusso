---
schemas:
  BalancerSwapRequest:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
        enum:
        - ethereum
        default: ethereum
      pool:
        type: [string, 'null']
        description: Registered Balancer V3 Ethereum Sepolia pool address. Omit for automatic discovery and best-quote selection.
      token_in:
        type: string
      token_out:
        type: string
      swap_kind:
        type: string
        enum:
        - exact_in
        - exact_out
        default: exact_in
      amount_raw:
        type: string
        description: Exact input amount for exact_in, or exact output amount for exact_out.
      limit_raw:
        type:
        - string
        - 'null'
        description: Minimum output for exact_in, or maximum input for exact_out. Derived from the quote when omitted.
      slippage_bps:
        type: integer
        minimum: 0
        maximum: 10000
        default: 100
      deadline:
        type:
        - integer
        - 'null'
        description: Future Unix timestamp. Defaults to twenty minutes after request handling.
      strategy_id:
        type:
        - string
        - 'null'
      callback_url:
        type:
        - string
        - 'null'
        format: uri
    required:
    - agent_id
    - token_in
    - token_out
    - amount_raw
  BalancerQuoteResponse:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
      smart_wallet_address:
        type: string
      pool_address:
        type: string
      pool_selection:
        type: string
        enum: [automatic, explicit]
      candidates_discovered:
        type: integer
      candidates_quoted:
        type: integer
      token_in:
        type: string
      token_out:
        type: string
      swap_kind:
        type: string
      amount_raw:
        type: string
      quoted_amount_raw:
        type: string
      limit_raw:
        type: string
      slippage_bps:
        type: integer
      deadline:
        type: integer
  BalancerPoolsResponse:
    type: object
    properties:
      chain: { type: string }
      token_in: { type: string }
      token_out: { type: string }
      pools:
        type: array
        items:
          type: object
          properties:
            pool_address: { type: string }
            name: { type: string }
            symbol: { type: string }
            pool_type: { type: string }
            total_liquidity_usd: { type: [string, 'null'] }
            swap_fee: { type: [string, 'null'] }
            is_initialized: { type: boolean }
            is_paused: { type: boolean }
            is_in_recovery_mode: { type: boolean }
            tokens:
              type: array
              items:
                type: object
                properties:
                  address: { type: string }
                  symbol: { type: string }
                  decimals: { type: integer }
                  index: { type: integer }
  BalancerTokenAmount:
    type: object
    properties:
      token:
        type: string
        description: Registered pool-token address.
      amount_raw:
        type: string
        description: Raw token base-unit amount.
    required:
    - token
    - amount_raw
  BalancerAddLiquidityRequest:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
        enum:
        - ethereum
        default: ethereum
      pool:
        type: string
      amounts_in:
        type: array
        minItems: 1
        maxItems: 3
        items:
          "$ref": "#/components/schemas/BalancerTokenAmount"
      min_bpt_amount_out_raw:
        type:
        - string
        - 'null'
        description: Explicit minimum BPT output. Derived from the quote when omitted.
      slippage_bps:
        type: integer
        minimum: 0
        maximum: 10000
        default: 100
      deadline:
        type:
        - integer
        - 'null'
        description: Expiration for temporary Permit2 allowances.
      strategy_id:
        type:
        - string
        - 'null'
      callback_url:
        type:
        - string
        - 'null'
        format: uri
    required:
    - agent_id
    - pool
    - amounts_in
  BalancerRemoveLiquidityRequest:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
        enum:
        - ethereum
        default: ethereum
      pool:
        type: string
      bpt_amount_in_raw:
        type: string
        description: Exact raw BPT amount to burn.
      min_amounts_out:
        type:
        - array
        - 'null'
        minItems: 1
        description: Optional token-address minimums. Omitted pool tokens use zero.
        items:
          "$ref": "#/components/schemas/BalancerTokenAmount"
      slippage_bps:
        type: integer
        minimum: 0
        maximum: 10000
        default: 100
      strategy_id:
        type:
        - string
        - 'null'
      callback_url:
        type:
        - string
        - 'null'
        format: uri
    required:
    - agent_id
    - pool
    - bpt_amount_in_raw
  BalancerLiquidityAmount:
    type: object
    properties:
      token:
        type: string
      amount_raw:
        type: string
  BalancerAddLiquidityQuoteResponse:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
      smart_wallet_address:
        type: string
      pool_address:
        type: string
      amounts_in:
        type: array
        items:
          "$ref": "#/components/schemas/BalancerLiquidityAmount"
      quoted_bpt_amount_out_raw:
        type: string
      min_bpt_amount_out_raw:
        type: string
      slippage_bps:
        type: integer
      deadline:
        type: integer
  BalancerRemoveLiquidityQuoteResponse:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
      smart_wallet_address:
        type: string
      pool_address:
        type: string
      bpt_amount_in_raw:
        type: string
      quoted_amounts_out:
        type: array
        items:
          "$ref": "#/components/schemas/BalancerLiquidityAmount"
      min_amounts_out:
        type: array
        items:
          "$ref": "#/components/schemas/BalancerLiquidityAmount"
      slippage_bps:
        type: integer
  BalancerPoolToken:
    type: object
    properties:
      index:
        type: integer
      address:
        type: string
      symbol:
        type: string
      name:
        type: string
      decimals:
        type: integer
      pool_balance_raw:
        type: string
      pool_balance_formatted:
        type: string
      live_balance_scaled_18_raw:
        type: string
  BalancerPoolResponse:
    type: object
    properties:
      chain:
        type: string
      pool_address:
        type: string
      pool_name:
        type: string
      pool_symbol:
        type: string
      pool_decimals:
        type: integer
      total_supply_raw:
        type: string
      total_supply_formatted:
        type: string
      router_address:
        type: string
      vault_address:
        type: string
      vault_explorer_address:
        type: string
      permit2_address:
        type: string
      is_registered:
        type: boolean
      is_initialized:
        type: boolean
      is_paused:
        type: boolean
      is_in_recovery_mode:
        type: boolean
      static_swap_fee_percentage_raw:
        type: string
      tokens:
        type: array
        items:
          "$ref": "#/components/schemas/BalancerPoolToken"
  BalancerTokenBalance:
    type: object
    properties:
      address:
        type: string
      symbol:
        type: string
      name:
        type: string
      decimals:
        type: integer
      wallet_balance_raw:
        type: string
      wallet_balance_formatted:
        type: string
  BalancerBalancesResponse:
    type: object
    properties:
      agent_id:
        type: string
      chain:
        type: string
      smart_wallet_address:
        type: string
      pool_address:
        type: string
      bpt_balance_raw:
        type: string
      bpt_balance_formatted:
        type: string
      tokens:
        type: array
        items:
          "$ref": "#/components/schemas/BalancerTokenBalance"
