---
"/protocols/morpho/market":
  get:
    summary: Read a Morpho Blue Base Sepolia market
    parameters:
    - in: query
      name: chain
      schema:
        type: string
        enum: [base]
        default: base
    - in: query
      name: market_id
      schema:
        type: string
        default: "0x6143c1e52ed45fb9a0551b349abb4a1b8c5962dd39545ac235a9c98610bf97da"
    responses:
      '200':
        description: Market parameters and accrued state
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MorphoMarketResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/morpho/markets":
  get:
    summary: Discover and rank Morpho Blue Base Sepolia markets
    description: Discovers CreateMarket events, verifies market parameters and state on-chain, applies explicit risk filters, and recommends the highest-ranked result. Actions still require an explicit market_id.
    parameters:
    - in: query
      name: chain
      schema: { type: string, enum: [base], default: base }
    - in: query
      name: loan_token
      schema: { type: string }
    - in: query
      name: collateral_token
      schema: { type: string }
    - in: query
      name: max_lltv_raw
      schema: { type: string }
    - in: query
      name: min_liquidity_raw
      schema: { type: string }
    - in: query
      name: require_available_oracle
      schema: { type: boolean, default: true }
    - in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    responses:
      '200':
        description: Filtered and ranked Morpho markets
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MorphoMarketsResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/morpho/position":
  get:
    summary: Read a Morpho Blue position, balances, health, and capacity
    parameters:
    - in: query
      name: agent_id
      required: true
      schema:
        type: string
    - in: query
      name: chain
      schema:
        type: string
        enum: [base]
        default: base
    - in: query
      name: market_id
      schema:
        type: string
        default: "0x6143c1e52ed45fb9a0551b349abb4a1b8c5962dd39545ac235a9c98610bf97da"
    responses:
      '200':
        description: Agent wallet position
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MorphoPositionResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/morpho/supply/simulate":
  post:
    summary: Simulate supplying loan assets to Morpho
    requestBody: &morphoRequest
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/MorphoActionRequest"
    responses: &morphoSimulationResponses
      '200':
        description: Simulation result
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExecutionResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/morpho/supply":
  post:
    summary: Supply loan assets to Morpho
    requestBody: *morphoRequest
    responses: &morphoExecutionResponses
      '200':
        description: Execution accepted or queued
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExecutionResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/morpho/withdraw/simulate":
  post:
    summary: Simulate withdrawing supplied loan assets from Morpho
    requestBody: *morphoRequest
    responses: *morphoSimulationResponses
"/protocols/morpho/withdraw":
  post:
    summary: Withdraw supplied loan assets from Morpho
    requestBody: *morphoRequest
    responses: *morphoExecutionResponses
"/protocols/morpho/supply-collateral/simulate":
  post:
    summary: Simulate supplying collateral to Morpho
    requestBody: *morphoRequest
    responses: *morphoSimulationResponses
"/protocols/morpho/supply-collateral":
  post:
    summary: Supply collateral to Morpho
    requestBody: *morphoRequest
    responses: *morphoExecutionResponses
"/protocols/morpho/withdraw-collateral/simulate":
  post:
    summary: Simulate withdrawing Morpho collateral
    requestBody: *morphoRequest
    responses: *morphoSimulationResponses
"/protocols/morpho/withdraw-collateral":
  post:
    summary: Withdraw Morpho collateral
    requestBody: *morphoRequest
    responses: *morphoExecutionResponses
"/protocols/morpho/borrow/simulate":
  post:
    summary: Simulate borrowing from Morpho
    requestBody: *morphoRequest
    responses: *morphoSimulationResponses
"/protocols/morpho/borrow":
  post:
    summary: Borrow from Morpho
    requestBody: *morphoRequest
    responses: *morphoExecutionResponses
"/protocols/morpho/repay/simulate":
  post:
    summary: Simulate repaying Morpho debt
    requestBody: *morphoRequest
    responses: *morphoSimulationResponses
"/protocols/morpho/repay":
  post:
    summary: Repay Morpho debt
    requestBody: *morphoRequest
    responses: *morphoExecutionResponses
