---
"/protocols/uniswap-v4/swap/quote":
  post:
    summary: Discover and quote the best Uniswap V4 pool on Ethereum Sepolia
    description: Discovers matching pool keys when fee and tick spacing are omitted, verifies live state, quotes viable candidates, and returns the best quote. A complete pool key may still be supplied explicitly.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UniswapV4SwapRequest"
    responses:
      "200":
        description: Uniswap V4 swap quote
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UniswapV4QuoteResponse"
      "400":
        "$ref": "#/components/responses/ErrorResponse"
      "401":
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/uniswap-v4/swap/simulate":
  post:
    summary: Simulate a single-pool Uniswap V4 swap
    description: Quotes the swap and fully simulates the Universal Router call plus temporary Permit2 approvals and cleanup as one UserOperation.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UniswapV4SwapRequest"
    responses:
      "200":
        description: Simulation result
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExecutionResponse"
      "400":
        "$ref": "#/components/responses/ErrorResponse"
      "401":
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/uniswap-v4/swap":
  post:
    summary: Execute a single-pool Uniswap V4 swap
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UniswapV4SwapRequest"
    responses:
      "200":
        description: Execution accepted or queued
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExecutionResponse"
      "400":
        "$ref": "#/components/responses/ErrorResponse"
      "401":
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/uniswap-v4/pool":
  get:
    summary: Read a Uniswap V4 pool from its complete pool key
    parameters:
    - { in: query, name: chain, required: false, schema: { type: string, enum: [ethereum], default: ethereum } }
    - { in: query, name: token_a, required: true, schema: { type: string } }
    - { in: query, name: token_b, required: true, schema: { type: string } }
    - in: query
      name: fee
      required: true
      schema:
        oneOf:
        - { type: integer, minimum: 0, maximum: 1000000 }
        - { type: integer, const: 8388608 }
    - in: query
      name: tick_spacing
      required: true
      schema: { type: integer, minimum: 1, maximum: 32767 }
    - { in: query, name: hooks, required: false, schema: { type: string, default: "0x0000000000000000000000000000000000000000" } }
    responses:
      "200":
        description: Uniswap V4 pool state
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UniswapV4PoolResponse"
      "400":
        "$ref": "#/components/responses/ErrorResponse"
      "401":
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/uniswap-v4/pools":
  get:
    summary: Discover Uniswap V4 pools for a currency pair
    parameters:
    - { in: query, name: chain, required: false, schema: { type: string, enum: [ethereum], default: ethereum } }
    - { in: query, name: token_a, required: true, schema: { type: string } }
    - { in: query, name: token_b, required: true, schema: { type: string } }
    - { in: query, name: include_hooked_pools, required: false, schema: { type: boolean, default: false } }
    responses:
      "200":
        description: Matching initialized V4 pool keys and current state
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UniswapV4PoolsResponse"
      "400":
        "$ref": "#/components/responses/ErrorResponse"
      "401":
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/uniswap-v4/balances":
  get:
    summary: Read two Uniswap pool-currency balances for an agent wallet
    parameters:
    - { in: query, name: agent_id, required: true, schema: { type: string } }
    - { in: query, name: chain, required: false, schema: { type: string, enum: [ethereum], default: ethereum } }
    - { in: query, name: token_a, required: true, schema: { type: string } }
    - { in: query, name: token_b, required: true, schema: { type: string } }
    responses:
      "200":
        description: Wallet currency balances
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UniswapV4BalancesResponse"
      "400":
        "$ref": "#/components/responses/ErrorResponse"
      "401":
        "$ref": "#/components/responses/ErrorResponse"
