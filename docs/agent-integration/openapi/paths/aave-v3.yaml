"/protocols/aave-v3/borrow/simulate":
  post:
    summary: Simulate Aave V3 Sepolia borrow action
    description: Checks projected health factor using Aave account data and oracle
      price before simulating Pool.borrow.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AaveBorrowRequest"
    responses:
      '200':
        description: Simulation result
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExecutionResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/aave-v3/borrow":
  post:
    summary: Execute Aave V3 Sepolia borrow action
    description: Checks projected health factor using Aave account data and oracle
      price before executing Pool.borrow.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AaveBorrowRequest"
    responses:
      '200':
        description: Execution accepted/queued
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExecutionResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/aave-v3/position":
  get:
    summary: Read Aave V3 Sepolia account data for an agent wallet
    parameters:
    - in: query
      name: agent_id
      required: true
      schema:
        type: string
    - in: query
      name: chain
      required: false
      schema:
        type: string
        enum:
        - ethereum
        default: ethereum
    responses:
      '200':
        description: Aave position response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AavePositionResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/aave-v3/balances":
  get:
    summary: Read Aave V3 Sepolia reserve balances for an agent wallet
    description: Returns underlying wallet balances, supplied aToken balances, stable
      debt, and variable debt for every supported Aave V3 Sepolia reserve.
    parameters:
    - in: query
      name: agent_id
      required: true
      schema:
        type: string
    - in: query
      name: chain
      required: false
      schema:
        type: string
        enum:
        - ethereum
        default: ethereum
    responses:
      '200':
        description: Aave reserve balances response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AaveBalancesResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
