---
"/protocols/aave-v3/supply/simulate":
  post:
    summary: Simulate Aave V3 Sepolia supply action
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AaveSupplyRequest"
    responses:
      '200':
        description: Simulation result
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExecutionResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/aave-v3/supply":
  post:
    summary: Execute Aave V3 Sepolia supply action
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AaveSupplyRequest"
    responses:
      '200':
        description: Execution accepted/queued
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExecutionResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
